<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세금 비교 시뮬레이터 | 원제우세무사 사무소</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f8f8f6;min-height:100vh;}
.container{max-width:900px;margin:0 auto;padding:28px 20px;}
.nav-back{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#888;text-decoration:none;margin-bottom:16px;}
.nav-back:hover{color:#185FA5;}
h1{font-size:20px;font-weight:600;margin-bottom:4px;}
.sub{font-size:13px;color:#666;margin-bottom:24px;}
.card{background:#fff;border:1px solid #e8e6df;border-radius:12px;padding:18px;margin-bottom:16px;}
.sec-t{font-size:11px;font-weight:600;color:#888;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
label{font-size:12px;color:#555;display:block;margin-bottom:4px;font-weight:500;}
input,select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:#1a1a1a;}
input:focus,select:focus{outline:none;border-color:#185FA5;}
.slider-wrap{display:flex;align-items:center;gap:10px;margin-top:4px;}
.slider-wrap input[type=range]{flex:1;accent-color:#185FA5;}
.slider-val{font-size:14px;font-weight:600;min-width:50px;text-align:right;color:#185FA5;}
.calc-btn{width:100%;padding:12px;border-radius:10px;border:none;background:#185FA5;color:#fff;cursor:pointer;font-size:15px;font-weight:600;margin-top:4px;transition:background .15s;}
.calc-btn:hover{background:#0C447C;}
.hidden{display:none;}
.compare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.cc{background:#fff;border:1px solid #e8e6df;border-radius:12px;padding:15px;}
.cc.best{border:2px solid #185FA5;}
.cc-tit{font-size:12px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;}
.best-b{background:#E6F1FB;color:#0C447C;font-size:10px;padding:2px 7px;border-radius:4px;}
.cr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f4f3ef;font-size:12px;}
.cr:last-child{border-bottom:none;padding-top:8px;margin-top:3px;}
.cm{color:#888;}
.tot{font-size:17px;font-weight:700;color:#A32D2D;}
.cgn{color:#3B6D11;font-weight:600;}
.cbl{color:#185FA5;font-weight:600;}
.crd{color:#A32D2D;font-weight:600;}
.fee-box{background:#E6F1FB;border-radius:10px;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.notice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ni{border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.7;}
.ni strong{display:block;margin-bottom:3px;}
.nibl{background:#E6F1FB;color:#0C447C;} .niam{background:#FAEEDA;color:#633806;} .nird{background:#FCEBEB;color:#A32D2D;} .nigr{background:#EAF3DE;color:#27500A;}
@media(max-width:640px){.fg{grid-template-columns:1fr;}.f3{grid-template-columns:1fr;}.compare-grid{grid-template-columns:1fr;}.notice-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="container">
<a class="nav-back" href="index.html">← 인덱스로 돌아가기</a>
<h1>🧮 세금 비교 시뮬레이터</h1>
<p class="sub">2024 귀속 종합소득세 · 추계(기준) / 추계(단순) / 장부 3가지 비교</p>

<div class="card">
  <div class="sec-t">수입 및 업종</div>
  <div class="fg">
    <div>
      <label>총 수입금액 (원)</label>
      <input type="number" id="rev" placeholder="예: 50000000" oninput="onRC()">
    </div>
    <div>
      <label>주 업종</label>
      <select id="ind" onchange="onRC()">
        <option value="940500">940500 인적용역 (보험모집 등)</option>
        <option value="940909">940909 인적용역 (기타)</option>
        <option value="940305">940305 인적용역 (기타2)</option>
        <option value="940903">940903 인적용역 (기타3)</option>
        <option value="940912">940912 개인서비스업</option>
        <option value="930913">930913 개인서비스업2</option>
        <option value="701201">701201 부동산임대업</option>
        <option value="552107">552107 음식점업</option>
        <option value="749100">749100 사업지원서비스</option>
        <option value="custom">직접입력</option>
      </select>
    </div>
    <div id="cr-wrap" class="hidden">
      <label>기준경비율 (%)</label>
      <input type="number" id="cstd" placeholder="예: 16.2" step="0.1">
    </div>
    <div id="cs-wrap" class="hidden">
      <label>단순경비율 (%)</label>
      <input type="number" id="csimp" placeholder="예: 64.1" step="0.1">
    </div>
  </div>
</div>

<div class="card">
  <div class="sec-t">소득공제 항목</div>
  <div class="f3">
    <div>
      <label>인적공제 인원</label>
      <select id="pers">
        <option value="1">본인 1인 (150만원)</option>
        <option value="2">2인 (300만원)</option>
        <option value="3">3인 (450만원)</option>
        <option value="4">4인 (600만원)</option>
        <option value="5">5인 (750만원)</option>
      </select>
    </div>
    <div>
      <label>국민연금 납부액 (원)</label>
      <input type="number" id="pen" placeholder="0">
    </div>
    <div>
      <label>노란우산공제 납입액 (원)</label>
      <input type="number" id="nk" placeholder="0">
    </div>
    <div>
      <label>개인연금저축 납입액 (원)</label>
      <input type="number" id="ps" placeholder="0">
    </div>
    <div>
      <label>원천징수 기납부세액 (원)</label>
      <input type="number" id="wh" placeholder="3.3% 원천징수 등">
    </div>
    <div>
      <label>중간예납세액 (원)</label>
      <input type="number" id="pp" placeholder="0">
    </div>
  </div>
</div>

<div class="card">
  <div class="sec-t">장부신고 소득률 설정</div>
  <div class="slider-wrap">
    <span style="font-size:12px;color:#888;">소득률</span>
    <input type="range" id="rsl" min="1" max="80" value="15" step="1" oninput="document.getElementById('rdsp').textContent=this.value+'%'">
    <span class="slider-val" id="rdsp">15%</span>
  </div>
  <p style="font-size:11px;color:#888;margin-top:6px;">장부 신고 시 소득금액 = 수입금액 × 소득률. 업종 평균 소득률 참고하여 설정.</p>
</div>

<button class="calc-btn" onclick="calc()">세금 계산하기</button>

<div id="result" class="hidden" style="margin-top:20px;">

<div class="card">
  <div class="sec-t">신고 방법별 세금 비교</div>
  <div class="compare-grid" id="cds"></div>
</div>

<div class="card" id="fee">
  <div class="sec-t">수수료 산출 (원제우세무사 보수표)</div>
  <div id="fee-body"></div>
</div>

<div class="card">
  <div class="sec-t">소득금액 확정에 따른 영향</div>
  <div class="notice-grid" id="notices"></div>
</div>

</div>
</div>

<script>
const N=v=>Number(v)||0;
const F=v=>Math.round(v).toLocaleString('ko-KR');
const RATES={'940500':{s:.162,d:.709},'940909':{s:.174,d:.641},'940305':{s:.266,d:.616},'940903':{s:.154,d:.617},'940912':{s:.34,d:.802},'930913':{s:.166,d:.846},'701201':{s:.199,d:.415},'552107':{s:.12,d:.861},'749100':{s:.224,d:.841},'custom':{s:.15,d:.60}};

function onRC(){
  const v=document.getElementById('ind').value==='custom';
  document.getElementById('cr-wrap').classList.toggle('hidden',!v);
  document.getElementById('cs-wrap').classList.toggle('hidden',!v);
}

function getRates(){
  const ind=document.getElementById('ind').value;
  if(ind==='custom') return{s:N(document.getElementById('cstd').value)/100,d:N(document.getElementById('csimp').value)/100};
  return RATES[ind]||{s:.15,d:.60};
}

function calcDed(inc){
  const p=N(document.getElementById('pers').value)*1500000;
  const pen=N(document.getElementById('pen').value);
  const nk=N(document.getElementById('nk').value);
  const ps=N(document.getElementById('ps').value);
  let nlim=inc<=40000000?6000000:inc<=60000000?5000000:inc<=100000000?4000000:2000000;
  return p+pen+Math.min(nk,nlim)+Math.min(ps*.4,720000);
}

function calcTax(inc){
  const ded=calcDed(inc);
  const tb=Math.max(0,inc-ded);
  let t=0;
  if(tb<=14000000)t=tb*.06;
  else if(tb<=50000000)t=840000+(tb-14000000)*.15;
  else if(tb<=88000000)t=6240000+(tb-50000000)*.24;
  else if(tb<=150000000)t=15360000+(tb-88000000)*.35;
  else if(tb<=300000000)t=37060000+(tb-150000000)*.38;
  else t=94060000+(tb-300000000)*.42;
  const cr=Math.min(t*.07,130000);
  const det=Math.max(0,Math.round(t-cr));
  const loc=Math.round(det*.1);
  const rate=tb<=14000000?6:tb<=50000000?15:tb<=88000000?24:tb<=150000000?35:38;
  return{ded:Math.round(ded),tb:Math.round(tb),t:Math.round(t),cr:Math.round(cr),det,loc,total:det+loc,rate};
}

function calcFee(rev){
  if(rev<24000000)return 110000;
  if(rev<36000000)return 165000;
  if(rev<50000000)return 330000;
  if(rev<100000000)return 330000+Math.round((rev-50000000)*33/10000);
  return 495000+Math.round((rev-100000000)*16.5/10000);
}

function calc(){
  const rev=N(document.getElementById('rev').value);
  if(!rev){alert('수입금액을 입력하세요.');return;}
  const rates=getRates();
  const slr=N(document.getElementById('rsl').value)/100;
  const wh=N(document.getElementById('wh').value);
  const pp=N(document.getElementById('pp').value);

  const i1=Math.round(rev*(1-rates.s));
  const i2=Math.round(rev*(1-rates.d));
  const i3=Math.round(rev*slr);
  const r1=calcTax(i1),r2=calcTax(i2),r3=calcTax(i3);
  const results=[
    {lbl:'추계 (기준경비율)',sub:`경비율 ${(rates.s*100).toFixed(1)}%`,inc:i1,r:r1},
    {lbl:'추계 (단순경비율)',sub:`경비율 ${(rates.d*100).toFixed(1)}%`,inc:i2,r:r2},
    {lbl:'장부 신고',sub:`소득률 ${(slr*100).toFixed(0)}%`,inc:i3,r:r3}
  ];
  const minT=Math.min(r1.total,r2.total,r3.total);

  document.getElementById('cds').innerHTML=results.map(d=>{
    const isBest=d.r.total===minT;
    const pay=d.r.total-(wh+pp);
    return `<div class="cc${isBest?' best':''}">
      <div class="cc-tit"><span>${d.lbl}<br><span style="font-size:11px;font-weight:400;color:#888;">${d.sub}</span></span>${isBest?'<span class="best-b">최저세액</span>':''}</div>
      <div class="cr"><span class="cm">① 수입금액</span><span>${F(rev)}원</span></div>
      <div class="cr"><span class="cm">② 필요경비</span><span style="color:#888;">△${F(rev-d.inc)}원</span></div>
      <div class="cr"><span class="cm">③ 소득금액</span><span>${F(d.inc)}원</span></div>
      <div class="cr"><span class="cm">④ 소득공제</span><span style="color:#888;">△${F(d.r.ded)}원</span></div>
      <div class="cr"><span class="cm">⑤ 과세표준</span><span>${F(d.r.tb)}원</span></div>
      <div class="cr"><span class="cm">적용세율</span><span>${d.r.rate}%</span></div>
      <div class="cr"><span class="cm">소득세</span><span>${F(d.r.det)}원</span></div>
      <div class="cr"><span class="cm">지방소득세(10%)</span><span>${F(d.r.loc)}원</span></div>
      <div class="cr"><span style="font-weight:600;">합계 세금</span><span class="tot">${F(d.r.total)}원</span></div>
      <div class="cr"><span class="cm">기납부세액</span><span style="color:#888;">△${F(wh+pp)}원</span></div>
      <div class="cr"><span style="font-weight:600;">${pay>0?'추가납부':'환급'}</span><span class="${pay>0?'crd':'cgn'}" style="font-size:15px;">${pay>0?'':'-'}${F(Math.abs(pay))}원</span></div>
    </div>`;
  }).join('');

  const fee=calcFee(rev);
  document.getElementById('fee-body').innerHTML=`
    <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px;">
      <thead><tr style="border-bottom:1px solid #e8e6df;">
        <th style="padding:6px 8px;font-size:11px;color:#888;font-weight:600;">신고 구분</th>
        <th style="padding:6px 8px;font-size:11px;color:#888;font-weight:600;text-align:right;">수수료 (VAT포함)</th>
        <th style="padding:6px 8px;font-size:11px;color:#888;font-weight:600;">산출 근거</th>
      </tr></thead>
      <tbody>
        <tr style="border-bottom:1px solid #f4f3ef;">
          <td style="padding:8px;">추계 (기준/단순경비율)</td>
          <td style="padding:8px;text-align:right;font-weight:600;">${F(fee)}원</td>
          <td style="padding:8px;font-size:12px;color:#888;">${rev<24000000?'24백만원 미만':rev<36000000?'24~36백만원':rev<50000000?'36백만원~5천만원':rev<100000000?'5천만원 초과분 ×33/10,000':'1억 초과 구간'} 적용</td>
        </tr>
        <tr>
          <td style="padding:8px;">간편장부 신고 (12개월)</td>
          <td style="padding:8px;text-align:right;font-weight:600;">${F(110000*12+fee)}원</td>
          <td style="padding:8px;font-size:12px;color:#888;">110,000 × 12개월 + ${F(fee)}원</td>
        </tr>
      </tbody>
    </table>
    <div class="fee-box"><span style="font-size:12px;color:#0C447C;font-weight:500;">🧾 추계 신고 적용 수수료</span><span style="font-size:18px;font-weight:700;color:#185FA5;">${F(fee)}원</span></div>`;

  const estPen=Math.round(i1*.045);
  const estHlt=Math.round(i1*.0709*.5);
  document.getElementById('notices').innerHTML=`
    <div class="ni nibl"><strong>🏦 국민연금</strong>소득금액 기준 연금보험료 재산정.<br>기준경비율 소득금액: <strong>${F(i1)}원</strong><br>추정 연금보험료: 연 약 <strong>${F(estPen)}원</strong><br>(소득×9%÷2, 지역가입자 기준)</div>
    <div class="ni niam"><strong>💊 건강보험료 (지역가입자)</strong>3.3% 프리랜서·개인사업자는 <strong>지역가입자</strong>로 소득+재산(주택·토지·건물·자동차) 점수 합산으로 보험료 산정. 소득 신고액이 올라가면 보험료도 함께 올라감.<br>2024년 소득 확정 → 2025년 하반기 정산 후 <strong>2026.07부터</strong> 변경 적용.<br><span style="font-size:11px;">※ 직장가입자는 급여 기준, 타소득 2천만원 초과분에 추가 부과.</span></div>
    <div class="ni nigr"><strong>🏠 대출·소득금액증명원</strong>이번 신고(2024 귀속)로 확정된 소득금액증명원은 <strong>2026.07 ~ 2027.06</strong> 대출 심사에 사용됩니다.<br>소득 높이면 → 대출 유리<br>소득 낮추면 → 세금·보험료 유리<br>신고 전 은행과 필요 소득금액 협의 권장.</div>
    <div class="ni nird"><strong>⚠️ 3.3% 프리랜서 주의</strong>사업자번호 없어도 동일 기준 신고 의무.<br>원천징수세액은 기납부세액으로 공제 적용.<br><strong>지역가입자</strong>로 건강보험료는 소득+재산 점수 합산 — 소득 신고액↑ = 보험료↑.<br>사후검증(10~12월) 또는 세무조사 시 사업 무관 경비 → 추가 세금 위험.</div>`;

  document.getElementById('result').classList.remove('hidden');
  document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
